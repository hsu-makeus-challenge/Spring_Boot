jwt:
  token:
    secretKey: { JWT_KEY }
    expiration:
      access: 3600000
      refresh: 86400000

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    umc.spring: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
